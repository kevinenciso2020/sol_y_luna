packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

# @napi-rs/wasm-runtime declares @emnapi/* as peers, but pnpm does not link them when the
# parent (@astrojs/astro2tsx, used by `astro check`) only has them as dependencies.
packageExtensions:
  '@napi-rs/wasm-runtime':
    dependencies:
      '@emnapi/core': '*'
      '@emnapi/runtime': '*'
